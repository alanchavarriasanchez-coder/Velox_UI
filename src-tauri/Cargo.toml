[package]
name = "veloxui"
version = "0.1.0"
description = "VeloxUI Chat Client"
authors = ["Alan"]
edition = "2021"

[lib]
name = "veloxui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-fs = "2"

[profile.dev]
debug = 1
